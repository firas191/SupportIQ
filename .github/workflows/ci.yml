name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  ai-service:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ai-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q

  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      # `./mvnw` et non `mvn` (S8-J1). Le runner GitHub fournit sa propre version de Maven, qui
      # change quand l'image change ; le wrapper fige la meme version ici et sur le poste, et c'est
      # la seule facon que « ca passe en CI » et « ca passe chez moi » parlent du meme outil.
      - run: ./mvnw -B -ntp verify

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  # Tests de bout en bout — **la suite bouchonnee uniquement** (S8-J1).
  #
  # Elle ne demande ni base, ni courtier, ni backend : toutes les reponses d'API sont simulees par
  # cy.intercept. Elle verifie ce dont l'interface est responsable — navigation, gardes de role,
  # etats de chargement, d'erreur et de vide, et la forme des donnees qu'elle sait consommer.
  #
  # La suite de fumee (`cypress/e2e/smoke/`) n'entre volontairement pas ici : elle exige toute la
  # pile et deux de ses parcours passent par un LLM. Elle serait rouge pour des raisons sans rapport
  # avec le code, et des rouges qui n'indiquent aucun defaut apprennent a ignorer les rouges.
  e2e:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      # `npm run e2e` demarre `ng serve`, attend qu'il reponde, lance Cypress, puis l'arrete.
      - run: npm run e2e
      # Capture d'ecran du moment de l'echec : sur un test d'interface, c'est souvent la seule trace
      # qui explique quelque chose. Conservee seulement en cas d'echec, pour ne pas alourdir les
      # executions vertes.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          if-no-files-found: ignore

  # Scan de dependances — **rapport, jamais blocage** (S8-J2).
  #
  # `continue-on-error` n'est pas une facilite. Une CVE publiee dans une dependance transitive
  # rendrait la CI rouge du jour au lendemain sans qu'une ligne de code ait bouge, et souvent sans
  # correctif disponible. Un rouge qu'on ne peut pas corriger apprend a ignorer les rouges — la
  # meme raison qui tient la campagne du juge (S5-J5) et la suite E2E de fumee hors de la CI.
  #
  # Le resultat reste visible dans le journal du job : c'est une information, pas une porte.
  dependencies:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high || true

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r ai-service/requirements.txt || true

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      # `dependency:tree` et non le plugin OWASP dependency-check : ce dernier telecharge la base
      # NVD complete (plusieurs centaines de Mo, plusieurs minutes) et exige desormais une cle
      # d'API. Disproportionne pour un projet de stage — l'arbre versionne suffit a repondre a
      # « quelle version de X utilisons-nous ? », qui est la question qu'on se pose vraiment quand
      # une CVE sort.
      - name: Arbre de dependances Maven
        working-directory: backend
        run: ./mvnw -B -ntp dependency:tree -DoutputFile=dependency-tree.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-tree
          path: backend/dependency-tree.txt
          if-no-files-found: ignore

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python eval/check_dataset.py
