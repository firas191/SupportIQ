services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports: ["5672:5672", "15672:15672"]  # 15672 = UI de management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      retries: 10

  # Serveur SMTP de developpement pour la synthese hebdomadaire (S6-J4).
  # Capture les courriels au lieu de les livrer : on verifie le sujet, le corps et la piece jointe
  # PDF sur http://localhost:8025 sans risquer d'ecrire a une vraie personne depuis un poste de dev.
  # C'est aussi ce qui rend le livrable « digest envoye » demontrable sans compte de messagerie.
  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]  # 8025 = interface web, 1025 = SMTP
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      retries: 10

  ai-service:
    build: ./ai-service
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      MODEL_DIR: /models
      # Second pool, en lecture seule, reserve au text-to-SQL (S6-J1). Utilisateur distinct de
      # celui de l'application : le SQL genere par un modele n'emprunte jamais ses droits.
      INSIGHT_DB_USER: insight_ro
      INSIGHT_DB_PASSWORD: ${INSIGHT_DB_PASSWORD:-insight}
    ports: ["8001:8001"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    volumes:
      - ./ai-service/app:/srv/app   # hot-reload en dev
      - ./ml/artifacts:/models:ro   # modele de triage (triage_xlmr.onnx + triage_tokenizer) — S3-J3
      - hf-cache:/root/.cache/huggingface   # cache du modele d'embeddings e5 (evite le re-telechargement) — S3-J4
      - ./eval:/eval                # harness d'evaluation + datasets (S3-J5, lance via docker compose exec)
      - ./ai-service/fixtures:/fixtures:ro   # corpus FAQ de demonstration (S5-J1) — chargeable via curl
      # Tests montes, pas copies dans l'image (S6-J2). L'image de production n'embarque ni les
      # tests ni pytest : c'est voulu. Mais pouvoir les jouer dans le conteneur evite d'installer
      # toute la pile d'inference sous Windows — meme raison que pour les harnesses d'eval.
      #   docker compose exec ai-service pip install -r /srv/requirements-dev.txt
      #   docker compose exec ai-service python -m pytest -q
      - ./ai-service/tests:/srv/tests:ro
      - ./ai-service/requirements-dev.txt:/srv/requirements-dev.txt:ro
      - ./ai-service/ruff.toml:/srv/ruff.toml:ro

  # Backend Spring (plan de contrôle). Lit .env comme les autres services -> secret JWT, admin,
  # webhook cohérents. Se connecte à postgres/rabbitmq par nom de service (DB_HOST/RABBITMQ_HOST).
  backend:
    build: ./backend
    env_file: .env
    environment:
      DB_HOST: postgres
      RABBITMQ_HOST: rabbitmq
      AI_SERVICE_URL: http://ai-service:8001   # tickets similaires (S4-J4)
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  # --- À activer au fil du projet -------------------------------------
  # frontend:       # Semaine 1, J4 — après génération Angular CLI
  #   build: ./frontend
  #   ports: ["4200:80"]

  # ollama:         # Semaine 6 — fallback LLM local
  #   image: ollama/ollama
  #   ports: ["11434:11434"]
  #   volumes: [ollama:/root/.ollama]

  # --- Langfuse (S3-J5) : observabilité LLM self-hosted. Décommenter pour tracer les appels. ---
  # langfuse-db:
  #   image: postgres:16-alpine
  #   environment: { POSTGRES_USER: langfuse, POSTGRES_PASSWORD: firas, POSTGRES_DB: langfuse }
  #   volumes: [langfuse-db:/var/lib/postgresql/data]
  # langfuse:
  #   image: langfuse/langfuse:2
  #   depends_on: [langfuse-db]
  #   ports: ["3000:3000"]
  #   environment:
  #     DATABASE_URL: postgresql://langfuse:firas@langfuse-db:5432/langfuse
  #     NEXTAUTH_SECRET: change-me-langfuse
  #     SALT: change-me-salt
  #     NEXTAUTH_URL: http://localhost:3000
  #   # Puis : creer un projet dans l'UI (http://localhost:3000), copier les cles dans .env
  #   # (LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY), et recreer ai-service.

volumes:
  pgdata:
  hf-cache:      # cache Hugging Face (modele d'embeddings e5) — S3-J4
