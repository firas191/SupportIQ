# Profil dev : secrets de developpement par defaut (jamais utilises en prod).
#
# **Le logging SQL est desormais opt-in** (S7-J5). Il etait actif par defaut, et comme
# `SPRING_PROFILES_ACTIVE` vaut `dev` faute de mieux, le backend **dockerise** — celui qui sert aux
# demonstrations et aux mesures — ecrivait une ligne formatee par requete JPA.
#
# Consequence constatee : un import de 50 000 tickets produisait 50 000 traces SQL multilignes. Le
# temps d'import mesure etait pour l'essentiel du temps de journalisation, et les journaux devenaient
# illisibles au moment precis ou l'on en avait besoin.
#
# Le tracage SQL est utile une journee, quand on debogue une requete precise. Le laisser par defaut
# le rend nuisible tout le reste du temps. Pour le rallumer :
#     SHOW_SQL=true SQL_LOG_LEVEL=debug
spring:
  jpa:
    show-sql: ${SHOW_SQL:false}

app:
  security:
    jwt:
      # Secret dev >= 32 octets. En prod : fournir JWT_SECRET (aucun defaut).
      secret: ${JWT_SECRET:dev-secret-supportiq-change-me-please-0123456789abcdef}
  bootstrap:
    admin:
      email: ${ADMIN_EMAIL:admin@supportiq.local}
      password: ${ADMIN_PASSWORD:admin1234}

logging:
  level:
    org.flywaydb: info
    org.hibernate.SQL: ${SQL_LOG_LEVEL:warn}
    org.springframework.security: info
