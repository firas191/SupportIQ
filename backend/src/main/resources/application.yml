spring:
  application:
    name: supportiq-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:supportiq}
    username: ${POSTGRES_USER:supportiq}
    password: ${POSTGRES_PASSWORD:firas}

  jpa:
    hibernate:
      ddl-auto: validate       # Flyway proprietaire du schema ; Hibernate valide seulement
    open-in-view: false        # anti-pattern desactive
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    placeholders:
      # Mot de passe du role read-only de l'agent Insight (V11). Passe en placeholder et non ecrit
      # dans la migration : un fichier de migration est versionne, un secret ne l'est pas.
      # Cle en minuscules et underscores — Spring normalise les cles de Map issues de la
      # configuration, un `insightPassword` n'arriverait pas tel quel jusqu'a Flyway.
      insight_password: ${INSIGHT_DB_PASSWORD:insight}

  servlet:
    multipart:
      max-file-size: 50MB       # imports CSV/XLSX volumineux (rapport : 10k+ lignes)
      max-request-size: 50MB

  mail:
    # Serveur SMTP de la synthese hebdomadaire (S6-J4).
    #
    # **Hote vide = aucun envoi.** Spring cree quand meme le bean (une propriete renseignee a la
    # chaine vide compte comme presente), c'est pourquoi `DigestMailer.configured()` verifie l'hote
    # explicitement plutot que la seule existence du bean.
    #
    # Le port a un defaut **1025** et non 25 : en developpement la cible est Mailpit, et le defaut
    # de JavaMail (25) fait echouer le premier essai sur un port que personne n'ecoute. Un reglage
    # indispensable ne doit pas dependre de la memoire de celui qui deploie.
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:1025}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:supportiq}
    password: ${RABBITMQ_DEFAULT_PASS:firas}

# --- Parametres applicatifs SupportIQ -------------------------------------
app:
  security:
    jwt:
      issuer: supportiq
      access-ttl: 15m
      refresh-ttl: 7d
      secret: ${JWT_SECRET:}
  bootstrap:
    admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
      full-name: ${ADMIN_FULL_NAME:Administrateur SupportIQ}
  imports:
    # Dossier de stockage des fichiers uploades (re-lus au confirm). En prod : volume Docker.
    storage-dir: ${IMPORTS_STORAGE_DIR:${java.io.tmpdir}/supportiq-imports}
  ai-service:
    # Plan de calcul (FastAPI) appele par Spring pour les tickets similaires (S4-J4).
    # En Docker : http://ai-service:8001 (nom de service) ; en dev local : http://localhost:8001.
    base-url: ${AI_SERVICE_URL:http://localhost:8001}
  reply:
    # Envoi au client de la reponse validee par un agent (S6, demi-journee hors planning).
    #
    # **Desactive par defaut, et ce n'est pas de la prudence excessive** : c'est la seule action de
    # la plateforme qui atteigne une personne exterieure, sous le nom de l'entreprise, sans retour
    # possible. Un environnement de developpement ne doit pas pouvoir ecrire a un vrai client
    # parce que quelqu'un a clique sur « Valider ». L'activation est un geste conscient.
    enabled: ${REPLY_ENABLED:false}
    from: ${REPLY_FROM:support@localhost}
  digest:
    # Destinataires de la synthese hebdomadaire, separes par des virgules. **Vide = aucun envoi** :
    # le digest est genere et consultable dans l'interface, mais rien ne part. C'est le defaut
    # volontaire en developpement — un environnement de test ne doit pas pouvoir ecrire a de vraies
    # personnes par accident.
    recipients: ${DIGEST_RECIPIENTS:}
    from: ${DIGEST_FROM:supportiq@localhost}
    auto-generate: ${DIGEST_AUTO:true}
    # Toutes les heures a partir du lundi 8 h. Ce n'est pas « lundi 8 h » au sens strict : les
    # passages suivants servent de **rattrapage** si l'application etait arretee. Ils ne generent
    # rien quand le digest de la semaine existe deja (contrainte d'unicite, V12).
    cron: ${DIGEST_CRON:0 0 8-23 * * MON}
  topics:
    # Detection des sujets emergents (S7-J1). Une fois par nuit : le calcul est lourd et les
    # sujets se mesurent en jours, pas en heures. Pas de rattrapage horaire, contrairement au
    # digest — un instantane manque est remplace par celui du lendemain, qui couvre la meme
    # fenetre glissante ; un digest manque, lui, n'existerait jamais.
    auto-detect: ${TOPICS_AUTO:true}
    cron: ${TOPICS_CRON:0 30 3 * * *}
  alerts:
    # Detection d'anomalies de volume (S7-J2). Toutes les 5 minutes : la mesure porte sur des
    # heures pleines, mais mesurer souvent raccourcit le delai de signalement sans rien couter
    # (aucun appel de modele). La contrainte d'unicite (V16) garantit qu'un meme pic n'est signale
    # qu'une fois, quel que soit le nombre de passages qui le retrouvent.
    auto-detect: ${ALERTS_AUTO:true}
    cron: ${ALERTS_CRON:0 */5 * * * *}
    # Nombre d'heures examinees a chaque passage. > 1 = rattrapage : une anomalie manquee pendant
    # un redemarrage a bien eu lieu, et ne se rattrape pas toute seule.
    lookback-hours: ${ALERTS_LOOKBACK:3}
  sla:
    # Recalcul du risque de depassement (S7-J3). Toutes les 10 minutes : le score vieillit par
    # construction, sa variable dominante etant le temps restant. 10 min = 2,5 % du budget le plus
    # court (4 h pour une priorite haute). L'interface affiche l'age du score.
    auto-score: ${SLA_AUTO:true}
    cron: ${SLA_CRON:0 */10 * * * *}
    # Seuil de la file « a risque ». Decision d'exploitation, pas propriete du modele : il fixe la
    # taille de la file prioritaire et devrait se regler sur la capacite de l'equipe (ADR-0010).
    at-risk-threshold: ${SLA_AT_RISK_THRESHOLD:0.70}
  intake:
    email:
      # Connecteur IMAP (S7-J4). **Desactive par defaut** : mal configure, il vide une vraie boite
      # aux lettres en la marquant comme lue. L'activation est un geste conscient, comme l'envoi
      # de reponses aux clients.
      enabled: ${INTAKE_EMAIL_ENABLED:false}
      host: ${INTAKE_EMAIL_HOST:}
      port: ${INTAKE_EMAIL_PORT:993}
      username: ${INTAKE_EMAIL_USER:}
      password: ${INTAKE_EMAIL_PASSWORD:}
      folder: ${INTAKE_EMAIL_FOLDER:INBOX}
      cron: ${INTAKE_EMAIL_CRON:0 */2 * * * *}
  insight:
    # Quota de questions par utilisateur et par heure (S6-J3). Chaque question coute jusqu'a
    # quatre appels de modele : la borne protege du dechainement accidentel (boucle dans un
    # script, onglet laisse a rafraichir), pas de la malveillance — l'utilisateur est authentifie.
    questions-per-hour: ${INSIGHT_QUESTIONS_PER_HOUR:30}
  webhook:
    # Ingestion temps reel (S2-J4). L'appelant s'authentifie par cle API + signature HMAC-SHA256
    # du corps brut (pas de JWT). En prod : une cle/secret par integration, stockes en base.
    api-key: ${WEBHOOK_API_KEY:dev-webhook-key}
    secret: ${WEBHOOK_SECRET:dev-webhook-secret-change-in-prod}
    rate-limit:
      capacity: ${WEBHOOK_RATE_CAPACITY:60}          # jetons max dans le seau
      refill-tokens: ${WEBHOOK_RATE_REFILL:60}        # jetons reajoutes par periode
      refill-period: ${WEBHOOK_RATE_PERIOD:PT1M}      # periode de recharge (ISO-8601, defaut 1 min)

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

server:
  port: ${SERVER_PORT:8080}
