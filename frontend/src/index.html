<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>SupportIQ — Analyse et triage du support client</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="SupportIQ analyse, priorise et regroupe vos tickets de support en temps reel.">
  <meta name="color-scheme" content="light dark">
  <!--
    Icones de l'application.

    Ordre volontaire : le navigateur retient la **derniere** declaration qu'il
    comprend, donc les PNG passent apres le .ico. Les PNG sont nets en haute
    densite la ou un .ico redimensionne a la volee devient flou.

    Le .ico reste indispensable : les navigateurs le demandent automatiquement
    a /favicon.ico, meme sans balise, et c'est le seul format lu par les
    raccourcis Windows. Il contient 5 resolutions (16 a 64) pour que le systeme
    prenne la bonne au lieu d'en redimensionner une.

    Le logo a ete recadre sur son contenu puis recentre avec ~6 % de marge :
    une favicon collee aux bords parait plus grosse que ses voisines dans la
    barre d'onglets.
  -->
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="brand/favicon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="brand/apple-touch-icon.png">

  <!--
    Inter : dessine pour les interfaces, hauteur d'x elevee, chiffres tabulaires.
    Material Symbols Rounded : jeu d'icones variable (graisse et remplissage
    pilotables en CSS), successeur de Material Icons.
    preconnect : le handshake TLS vers les serveurs de police demarre pendant
    l'analyse du HTML plutot qu'a la decouverte du <link>. ~100 ms gagnes.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block" rel="stylesheet">

  <!--
    Application du theme AVANT le premier rendu.
    Sans ce script, l'application demarre en clair puis bascule en sombre a
    l'initialisation d'Angular : un flash blanc d'environ 300 ms, tres visible
    et tres « pas fini ». Le script est volontairement inline et synchrone —
    c'est l'un des rares cas ou bloquer le rendu est le bon choix.
  -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('supportiq.theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = saved === 'light' || saved === 'dark' ? saved : (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <style>
    /* Ecran d'amorcage : occupe la fenetre pendant le telechargement du bundle
       Angular. Valeurs en dur car les tokens ne sont pas encore charges — mais
       identiques a --bg-canvas, pour qu'il n'y ait aucune rupture visuelle au
       moment ou l'application prend la main. */
    html[data-theme='light'] { background: #f7f8fb; }
    html[data-theme='dark'] { background: #0b0d12; }

    .boot {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 1;
    }

    .boot__mark {
      width: 44px;
      height: 44px;
      object-fit: contain;
      animation: boot-pulse 1.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }

    @keyframes boot-pulse {
      0%, 100% { opacity: 0.35; transform: scale(0.94); }
      50% { opacity: 1; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .boot__mark { animation: none; opacity: 0.8; }
    }

    /* Des qu'Angular a rendu app-root, l'ecran d'amorcage disparait. */
    app-root:not(:empty) + .boot { display: none; }
  </style>
</head>

<body>
  <app-root></app-root>
  <div class="boot" aria-hidden="true">
    <!-- Version 192 px et non le logo source : l'ecran d'amorcage l'affiche a
         44 px, servir 625 px couterait 30 ko avant meme le bundle Angular. -->
    <img class="boot__mark" src="brand/favicon-192.png" alt="" width="44" height="44">
  </div>
</body>
</html>
